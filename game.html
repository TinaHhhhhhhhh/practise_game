<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life</title>
    <style>
        /* ====== CSS 样式 ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .game-wrapper {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        canvas {
            display: block;
            border-radius: 12px;
            background: #fafcff;
            border: 2px solid #e8ecf0;
            cursor: pointer;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }
        .score {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        button {
            background: #e8ecf0;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #d5dce3;
            transform: scale(0.95);
        }
        .hint {
            color: #7f8c8d;
            font-size: 14px;
        }
        .hint kbd {
            background: #e8ecf0;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
                /* 语言选择界面 */
        .lang-screen {
            position: fixed;
            inset: 0;
            background: rgba(44, 62, 80, 0.55);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        .lang-screen.hidden {
            display: none;
        }
        .lang-title {
            color: white;
            font-size: 26px;
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .lang-buttons {
            display: flex;
            gap: 20px;
        }
        .lang-btn {
            background: white;
            border: none;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- ====== HTML 画布 ====== -->
        <canvas id="gameCanvas" width="600" height="200"></canvas>
        
        <div class="controls">
            <span class="score">得分: <span id="scoreDisplay">0</span></span>
            <span class="hint"><kbd>空格</kbd> 或 点击跳跃</span>
            <button id="switchLangBtn" onclick="location.href='start_game.html'">切换语言</button>
        </div>
    </div>

    <!-- ====== JavaScript 游戏逻辑 ====== -->
    <script>
        // 1. 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // 高清屏适配
        const DPR = window.devicePixelRatio || 1;   // 普通屏=1，Retina=2，4K屏可能=1.5~3
        const LOGICAL_W = 600;    // 逻辑宽（你代码里的坐标系）
        const LOGICAL_H = 200;    // 逻辑高

        canvas.width = LOGICAL_W * DPR;    // 实际像素 = 逻辑 × DPR
        canvas.height = LOGICAL_H * DPR;
        canvas.style.width = '900px';    // 600 × 1.5
        canvas.style.height = '300px';   // 200 × 1.5
        ctx.scale(DPR, DPR);   // 让 ctx 继续用逻辑坐标
        let scoreSpan = document.getElementById('scoreDisplay');
        // 语言文案表
        const TEXTS = {
            zh: {
                score: '得分: ',
                hint: '<kbd>空格</kbd> 或 点击跳跃',
                gameOver: '你因为GPA过低而失败了',
                gameOverSub: '按「空格」再来一局',
                switchLang: '切换语言'
            },
            en: {
                score: 'Score: ',
                hint: '<kbd>Space</kbd> or click to jump',
                gameOver: 'You died because of low GPA',
                gameOverSub: 'Press "Space" to play again',
                switchLang: 'Switch Language'
            }
        };
        // 从语言选择页读语言（没选过就默认中文）
        let currentLang = localStorage.getItem('dinoLang') || 'zh';

        // 2. 游戏参数
        const GROUND_Y = 170;          // 地面高度
        const DINO_WIDTH = 40;         // 恐龙宽度
        const DINO_HEIGHT = 60;        // 恐龙高度
        const DINO_X = 60;             // 恐龙水平位置
        const JUMP_FORCE = -9.5;       // 跳跃力度
        const GRAVITY = 0.55;          // 重力
        // 碰撞判定收缩量（越大判定越宽松）
        const DINO_HITBOX_SHRINK = 6;      // 恐龙四周各缩 6 像素
        const CACTUS_HITBOX_SHRINK = 6;    // 障碍物四周各缩 6 像素
        // 障碍物参数
        const CACTUS_WIDTH = 35;
        const CACTUS_HEIGHT = 45;
        const CACTUS_SPEED = 7;        // 障碍物移动速度
        const CACTUS_MIN_GAP = 250;    // 障碍物之间最小间距（像素）
        const CACTUS_MAX_GAP = 600;    // 最大间距
        // 障碍物数组
        let obstacles = [];
        let nextSpawnX = 600;          // 下一个障碍物生成位置
        let nextGap = 0;   // 距离生成下一个障碍物的距离

        // 3. 游戏状态
        let dino = {
            x: DINO_X,
            y: GROUND_Y - DINO_HEIGHT,
            w: DINO_WIDTH,
            h: DINO_HEIGHT,
            vy: 0,
            grounded: true
        };
        let jumpCharging = false;   // 是否正在蓄力
        let jumpChargeStart = 0;    // 开始蓄力的时间
        
        let score = 0;
        let gameOver = false;
        let gameRunning = true;

        // 4. 加载玩家和障碍物图片（如果有图片的话）
        // 方法：把图片放在 images 文件夹，然后取消下面的注释
        const dinoImage = new Image();
        dinoImage.src = 'images/character.png';  // 玩家图片路径
        let imageLoaded = false;
        dinoImage.onload = function() {
            imageLoaded = true;
            console.log('图片加载成功！');
        };
        dinoImage.onerror = function() {
            console.log('图片加载失败，将使用图形绘制');
        };
        // 加载障碍物图片
        const cactusImage = new Image();
        let cactusImageLoaded = false;

        cactusImage.onload = function() {
            cactusImageLoaded = true;
            console.log('仙人掌图片加载成功！');
        };
        cactusImage.onerror = function() {
            console.log('仙人掌图片加载失败，将使用图形绘制');
        };

        cactusImage.src = 'images/obstacle.png';   // ← 障碍物图片路径
        
        // 应用语言
        function applyLanguage(lang) {
            currentLang = lang;
            const t = TEXTS[lang];

            // 更新得分文案（保留分数数字）
            const scoreEl = document.querySelector('.score');
            scoreEl.innerHTML = t.score + '<span id="scoreDisplay">' + Math.floor(score) + '</span>';
            scoreSpan = document.getElementById('scoreDisplay');

            // 更新按钮和提示文案
            document.querySelector('.hint').innerHTML = t.hint;

            // 更新「切换语言」按钮
            document.getElementById('switchLangBtn').textContent = t.switchLang;
        }

        // 5. 跳跃函数
        // 按下空格：开始蓄力
        function startCharge() {
            if (gameOver || !gameRunning) return;
            if (dino.grounded && !jumpCharging) {  
                jumpCharging = true;
                jumpChargeStart = performance.now();
            }
        }

        // 松开空格：根据蓄力时间跳
        function releaseJump() {
            if (!jumpCharging) return;
            jumpCharging = false;

            let holdTime = performance.now() - jumpChargeStart;
            holdTime = Math.min(holdTime, 400);

            // 轻点 = -8.5（和以前一样），长按 = 最多到 -12
            const force = -8.5 - (holdTime / 400) * 3.5;

            dino.vy = force;
            dino.grounded = false;
        }

        // 6. 物理更新
        function update() {
            if (gameOver || !gameRunning) return;

            // 重力影响
            dino.vy += GRAVITY;
            dino.y += dino.vy;

            // 地面碰撞
            const floorY = GROUND_Y - DINO_HEIGHT;
            if (dino.y >= floorY) {
                dino.y = floorY;
                dino.vy = 0;
                dino.grounded = true;
            }

            // ----- 1. 障碍物向左移动 -----
            for (let o of obstacles) {
                o.x -= CACTUS_SPEED;
            }

            // ----- 2. 移除跑出屏幕的障碍物 -----
            obstacles = obstacles.filter(o => o.x + o.w > 0);

            // ----- 3. 生成新障碍物（随机间距）-----
            const last = obstacles[obstacles.length - 1];
            if (!last || last.x < 600 - nextGap) {
                obstacles.push({
                    x: 600,
                    y: GROUND_Y - CACTUS_HEIGHT,
                    w: CACTUS_WIDTH,
                    h: CACTUS_HEIGHT
                });
                // 生成后，随机一个新的间距
                nextGap = CACTUS_MIN_GAP + Math.random() * (CACTUS_MAX_GAP - CACTUS_MIN_GAP);
            }

            // ----- 4. 碰撞检测（撞上就结束）-----
            for (let o of obstacles) {
                // 恐龙判定框（缩小）
                const dx = dino.x + DINO_HITBOX_SHRINK;
                const dy = dino.y + DINO_HITBOX_SHRINK;
                const dw = dino.w - DINO_HITBOX_SHRINK * 2;
                const dh = dino.h - DINO_HITBOX_SHRINK * 2;

                // 障碍物判定框（缩小）
                const ox = o.x + CACTUS_HITBOX_SHRINK;
                const oy = o.y + CACTUS_HITBOX_SHRINK;
                const ow = o.w - CACTUS_HITBOX_SHRINK * 2;
                const oh = o.h - CACTUS_HITBOX_SHRINK * 2;

                if (
                    dx < ox + ow &&
                    dx + dw > ox &&
                    dy < oy + oh &&
                    dy + dh > oy
                ) {
                    gameOver = true;
                    gameRunning = false;
                    return;
                }
            }

            // 增加分数
            score += 0.5;
            scoreSpan.textContent = Math.floor(score);
        }

        // 7. 绘制画面
        function draw() {
            ctx.clearRect(0, 0, 600, 200);

            // ----- 画地面 -----
            ctx.beginPath();
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2.5;
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(600, GROUND_Y);
            ctx.stroke();

            // 地面装饰线
            ctx.fillStyle = '#bdc3c7';
            for (let i = 0; i < 600; i += 40) {
                ctx.fillRect(i, GROUND_Y + 3, 15, 3);
            }

            // ----- 画障碍物（仙人掌）-----
            for (let o of obstacles) {
                if (cactusImageLoaded) {
                    // 用图片绘制
                    ctx.drawImage(cactusImage, o.x, o.y, o.w, o.h);
                } else {
                    // 图片没加载成功时，用图形兜底
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.roundRect(o.x + 6, o.y, 8, o.h, 3);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.roundRect(o.x, o.y + 12, 6, 14, 3);
                    ctx.fill();
                    ctx.fillRect(o.x, o.y + 12, 12, 6);
                    ctx.beginPath();
                    ctx.roundRect(o.x + 14, o.y + 18, 6, 12, 3);
                    ctx.fill();
                    ctx.fillRect(o.x + 8, o.y + 18, 12, 6);
                }
            }

            // ----- 画恐龙 -----
            if (imageLoaded) {
                // 用图片绘制
                ctx.drawImage(dinoImage, dino.x, dino.y, dino.w, dino.h);
            } else {
                // 图片没加载成功时，用图形兜底
                ctx.shadowColor = 'rgba(0,0,0,0.05)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.roundRect(dino.x, dino.y, dino.w, dino.h, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#5d6d7e';
                ctx.beginPath();
                ctx.roundRect(dino.x + 5, dino.y + 8, dino.w - 10, dino.h - 16, 5);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(dino.x + 20, dino.y + 9, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(dino.x + 22, dino.y + 8, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(dino.x + 20, dino.y + 15, 5, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.fillStyle = '#e8a0a0';
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(dino.x + 9, dino.y + 16, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#a0522d';
                ctx.beginPath();
                ctx.moveTo(dino.x + 6, dino.y - 2);
                ctx.lineTo(dino.x + 13, dino.y - 10);
                ctx.lineTo(dino.x + 20, dino.y - 2);
                ctx.fill();
            }

            // ----- 游戏结束遮罩 -----
            if (gameOver) {
                ctx.fillStyle = 'rgba(44, 62, 80, 0.4)';
                ctx.fillRect(0, 0, 600, 200);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const t = TEXTS[currentLang];
                ctx.fillText(t.gameOver, 300, 80);
                ctx.font = '16px Arial';
                ctx.fillText(t.gameOverSub, 300, 130);
            }
        }

        // 8. 重置游戏
        function resetGame() {
            dino.y = GROUND_Y - DINO_HEIGHT;
            dino.vy = 0;
            dino.grounded = true;
            score = 0;
            gameOver = false;
            gameRunning = true;
            scoreSpan.textContent = '0';

            obstacles = [];        // ← 清空障碍物
            nextSpawnX = 600;      // ← 重置生成位置（如果用旧逻辑）
        }

        // 9. 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 10. 事件绑定
        // 键盘：按下开始蓄力，松开跳
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (gameOver) {
                    resetGame();
                } else {
                    startCharge();
                }
            }
        });
        document.addEventListener('keyup', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                releaseJump();
            }
        });

        // 鼠标：按下蓄力，松开跳
        canvas.addEventListener('mousedown', function() {
            if (gameOver) { resetGame(); } else { startCharge(); }
        });
        canvas.addEventListener('mouseup', function() {
            releaseJump();
        });

        // 触摸：按下蓄力，松开跳
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (gameOver) { resetGame(); } else { startCharge(); }
        });
        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            releaseJump();
        });

        // 11. 启动游戏
        // 语言选择按钮
        applyLanguage(currentLang);
        gameLoop();

        // 12. 辅助：roundRect 方法
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    </script>
</body>
</html>
