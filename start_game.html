<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择语言 / Choose Language</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 40px;
        }
        .lang-buttons {
            display: flex;
            gap: 20px;
        }
        .lang-btn {
            background: white;
            border: 2px solid #e8ecf0;
            padding: 20px 50px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.1);
            border-color: #2c3e50;
        }
    </style>
</head>
<body>
    <h1>选择语言 / Choose Language</h1>
    <div class="lang-buttons">
        <button class="lang-btn" onclick="chooseLang('zh')">中文</button>
        <button class="lang-btn" onclick="chooseLang('en')">English</button>
    </div>

    <script>
        function chooseLang(lang) {
            // 把语言存起来，跳转到游戏页
            localStorage.setItem('dinoLang', lang);
            window.location.href = 'game.html';
        }
    </script>
</body>
</html>
